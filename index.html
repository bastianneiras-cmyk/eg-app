<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Contenedor de la app E&G (Apps Script) para GitHub Pages: da el ícono y el nombre
       al agregarla a la pantalla de inicio. La app real se carga en el iframe (APP_URL). -->
  <title>E&amp;G Mantenimiento</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="E&amp;G">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#062949">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #FFFFFF; overflow: hidden; }
    body {
      /* Respeta el notch y la barra inferior del iPhone */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      box-sizing: border-box; height: 100vh; height: 100dvh;
    }
    #app { display: block; width: 100%; height: 100%; border: 0; }
    #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 28px; background: #FFFFFF; transition: opacity .35s ease; }
    #splash img { width: 62vw; max-width: 300px; height: auto; }
    #splash .barra { width: 120px; height: 4px; border-radius: 2px; background: #EEF1F5; overflow: hidden; }
    #splash .barra span { display: block; width: 40%; height: 100%; background: #F8B60A; animation: carga 1.1s ease-in-out infinite; }
    #splash.oculto { opacity: 0; pointer-events: none; }
    #splash p { margin: 0; font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #5A6775;
      text-align: center; padding: 0 24px; }
    @keyframes carga { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) { #splash .barra span { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/logo.png" alt="E&amp;G">
    <div class="barra"><span></span></div>
    <p id="aviso" hidden></p>
  </div>
  <iframe id="app" title="E&amp;G Mantenimiento" allow="web-share; clipboard-write"></iframe>

  <script>
    // URL /exec de la implementación de Apps Script. Si cambia, editar solo esta línea.
    var APP_URL = 'https://script.google.com/macros/s/AKfycbx4unuNBeh4eJsgjnvN5OY1-DgnmbzVWaNytcblDSrDLpVJGgynoEjTkIczq85xQ7Pkcg/exec';

    var splash = document.getElementById('splash');
    var marco = document.getElementById('app');
    function ocultarSplash() { splash.classList.add('oculto'); }

    if (/PEGAR_AQUI/.test(APP_URL)) {
      var a = document.getElementById('aviso');
      a.textContent = 'Falta configurar APP_URL en index.html.';
      a.hidden = false;
    } else {
      marco.addEventListener('load', ocultarSplash);
      // Por si el evento load no llega (red lenta), no dejar el splash pegado
      setTimeout(ocultarSplash, 20000);
      marco.src = APP_URL;
    }
  </script>
</body>
</html>
